<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Exam practice, checklists, a paper-trading watchlist and a focus timer for Meta Ray-Ban Display.">
<meta name="mrbd-web-app-capable" content="yes">
<meta name="application-name" content="Toolkit">
<meta name="color-scheme" content="dark">
<title>Toolkit</title>
<style>
  /* Additive display: black is see-through, so only content lights up.
     --u = one design pixel at the 600 x 600 lens, scaled to the real viewport. */
  :root {
    --ink: #ffffff;
    --soft: rgba(255, 255, 255, .64);
    --faint: rgba(255, 255, 255, .42);
    --gold: #ffc857;
    --gold-fill: rgba(255, 200, 87, .14);
    --blue: #8fd3ff;
    --green: #7ee2a8;
    --red: #ff8f8f;
    --edge: rgba(255, 255, 255, .30);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; inline-size: 100%; block-size: 100%; background: #000; }
  body {
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  #app {
    --u: calc(min(100vw, 100vh, 760px) / 600);
    inline-size: min(100%, 760px);
    block-size: 100%;
    margin-inline: auto;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    padding: calc(var(--u) * 22) calc(var(--u) * 30) calc(var(--u) * 14);
  }
  .bar {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: calc(var(--u) * 12);
    padding-block-end: calc(var(--u) * 10);
    font-size: calc(var(--u) * 16);
    font-weight: 700;
    color: var(--soft);
    font-variant-numeric: tabular-nums;
  }
  #crumb {
    color: var(--gold);
    letter-spacing: .14em;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #view {
    overflow-y: auto;
    min-block-size: 0;
    padding: calc(var(--u) * 6);
    scrollbar-width: none;
  }
  #view::-webkit-scrollbar { display: none; }

  h1 { margin: 0 0 calc(var(--u) * 6); font-size: calc(var(--u) * 30); line-height: 1.15; }
  .sub { margin: 0 0 calc(var(--u) * 16); font-size: calc(var(--u) * 18); color: var(--soft); font-variant-numeric: tabular-nums; }
  .note { margin: calc(var(--u) * 14) 0 0; font-size: calc(var(--u) * 14); line-height: 1.45; color: var(--faint); }
  .stack { display: flex; flex-direction: column; gap: calc(var(--u) * 10); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * 10); }
  .row { display: flex; gap: calc(var(--u) * 10); }
  .row > * { flex: 1 1 0; }

  .btn {
    font: inherit;
    color: var(--ink);
    background: rgba(255, 255, 255, .05);
    border: calc(var(--u) * 2) solid var(--edge);
    border-radius: calc(var(--u) * 16);
    padding: calc(var(--u) * 12) calc(var(--u) * 16);
    font-size: calc(var(--u) * 20);
    font-weight: 600;
    line-height: 1.25;
    text-align: start;
    cursor: pointer;
    min-inline-size: 0;
  }
  .btn.center { text-align: center; }
  .btn.primary { color: var(--gold); border-color: var(--gold); background: var(--gold-fill); text-align: center; }
  .btn small { display: block; margin-block-start: calc(var(--u) * 3); font-size: .72em; font-weight: 600; color: var(--soft); }
  .btn:focus { outline: none; }
  .btn:focus, .btn:focus-visible {
    outline: calc(var(--u) * 3) solid var(--ink);
    outline-offset: calc(var(--u) * 3);
    background: rgba(255, 255, 255, .16);
  }
  .btn.primary:focus { background: rgba(255, 200, 87, .30); }
  .btn:disabled { cursor: default; }
  .tile { min-block-size: calc(var(--u) * 92); display: flex; flex-direction: column; justify-content: center; }
  .tile b { font-size: calc(var(--u) * 23); }

  /* Practice */
  .qnum { margin: 0 0 calc(var(--u) * 8); font-size: calc(var(--u) * 15); font-weight: 700; color: var(--blue); letter-spacing: .1em; text-transform: uppercase; }
  .q { margin: 0 0 calc(var(--u) * 14); font-size: calc(var(--u) * 25); font-weight: 600; line-height: 1.3; white-space: pre-line; }
  .choice { display: grid; grid-template-columns: auto 1fr auto; gap: calc(var(--u) * 12); align-items: baseline; }
  .choice .letter { color: var(--soft); font-weight: 800; }
  .choice .mark { font-weight: 800; }
  .choice.correct { border-color: var(--green); background: rgba(126, 226, 168, .14); }
  .choice.correct .mark { color: var(--green); }
  .choice.wrong { border-color: var(--red); background: rgba(255, 143, 143, .12); }
  .choice.wrong .mark { color: var(--red); }
  .choice:disabled:not(.correct):not(.wrong) { opacity: .45; }
  .answer {
    margin: 0 0 calc(var(--u) * 12);
    padding: calc(var(--u) * 12) calc(var(--u) * 16);
    border-inline-start: calc(var(--u) * 4) solid var(--gold);
    background: rgba(255, 200, 87, .08);
    border-radius: calc(var(--u) * 8);
    font-size: calc(var(--u) * 22);
    font-weight: 600;
    line-height: 1.35;
    white-space: pre-line;
  }
  .why { margin: 0 0 calc(var(--u) * 14); font-size: calc(var(--u) * 18); line-height: 1.4; color: var(--soft); white-space: pre-line; }
  .verdict { margin: calc(var(--u) * 12) 0 calc(var(--u) * 8); font-size: calc(var(--u) * 20); font-weight: 800; }
  .verdict.good { color: var(--green); }
  .verdict.bad { color: var(--red); }
  .score { font-size: calc(var(--u) * 64); font-weight: 800; line-height: 1; margin: calc(var(--u) * 8) 0; }

  /* Checklists */
  .check { display: grid; grid-template-columns: auto 1fr; gap: calc(var(--u) * 14); align-items: center; }
  .box {
    inline-size: calc(var(--u) * 26);
    block-size: calc(var(--u) * 26);
    border: calc(var(--u) * 2.5) solid var(--soft);
    border-radius: calc(var(--u) * 7);
    display: grid;
    place-items: center;
    font-size: calc(var(--u) * 18);
    font-weight: 900;
    color: #000;
  }
  .check[aria-pressed="true"] { color: var(--faint); }
  .check[aria-pressed="true"] .box { background: var(--green); border-color: var(--green); }
  .pbar { block-size: calc(var(--u) * 6); border-radius: 99px; background: rgba(255, 255, 255, .14); overflow: hidden; margin: 0 0 calc(var(--u) * 16); }
  .pbar i { display: block; block-size: 100%; background: var(--green); transition: inline-size .25s ease; }

  /* Markets */
  .qrow { display: grid; grid-template-columns: 1fr auto auto; gap: calc(var(--u) * 14); align-items: baseline; font-variant-numeric: tabular-nums; }
  .qrow .sym { font-weight: 800; font-size: calc(var(--u) * 22); }
  .qrow .px { font-weight: 700; font-size: calc(var(--u) * 21); }
  .qrow .chg { font-weight: 800; font-size: calc(var(--u) * 18); min-inline-size: calc(var(--u) * 96); text-align: end; }
  .qrow .pos { grid-column: 1 / -1; font-size: calc(var(--u) * 15); font-weight: 600; color: var(--soft); margin-block-start: calc(var(--u) * -4); }
  .up { color: var(--green); }
  .down { color: var(--red); }
  .flat { color: var(--soft); }
  .big { font-size: calc(var(--u) * 54); font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * 8) calc(var(--u) * 20); margin: calc(var(--u) * 16) 0; font-size: calc(var(--u) * 19); font-variant-numeric: tabular-nums; }
  .stats div { display: flex; justify-content: space-between; gap: calc(var(--u) * 8); }
  .stats span { color: var(--soft); font-weight: 600; }
  .range { position: relative; block-size: calc(var(--u) * 8); border-radius: 99px; background: rgba(255, 255, 255, .16); margin: calc(var(--u) * 6) 0 calc(var(--u) * 4); }
  .range i { position: absolute; top: 50%; inline-size: calc(var(--u) * 16); block-size: calc(var(--u) * 16); border-radius: 50%; background: var(--gold); transform: translate(-50%, -50%); }
  .rangelbl { display: flex; justify-content: space-between; font-size: calc(var(--u) * 14); color: var(--soft); font-variant-numeric: tabular-nums; }
  .summary { margin: 0 0 calc(var(--u) * 12); font-size: calc(var(--u) * 19); font-weight: 700; font-variant-numeric: tabular-nums; }

  /* Timer */
  .phase { margin: calc(var(--u) * 6) 0 0; text-align: center; font-size: calc(var(--u) * 20); font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
  .phase.work { color: var(--gold); }
  .phase.rest { color: var(--blue); }
  .clock { text-align: center; font-size: calc(var(--u) * 132); font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; margin: calc(var(--u) * 4) 0; }
  .clock.paused { opacity: .45; }
  .tsub { text-align: center; margin: 0 0 calc(var(--u) * 18); font-size: calc(var(--u) * 17); color: var(--soft); }
  .minutes { text-align: center; font-size: calc(var(--u) * 60); font-weight: 800; font-variant-numeric: tabular-nums; }

  #toast {
    position: fixed;
    inset-inline: 0;
    bottom: calc(min(100vw, 100vh, 760px) / 600 * 30);
    margin-inline: auto;
    inline-size: max-content;
    max-inline-size: 80%;
    padding: calc(min(100vw, 100vh, 760px) / 600 * 8) calc(min(100vw, 100vh, 760px) / 600 * 18);
    border-radius: 99px;
    border: 2px solid var(--edge);
    background: rgba(255, 255, 255, .12);
    font-size: calc(min(100vw, 100vh, 760px) / 600 * 19);
    font-weight: 700;
    opacity: 0;
    transition: opacity .2s ease;
    pointer-events: none;
  }
  #toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .pbar i, #toast { transition: none; } }
</style>
</head>
<body>
<main id="app">
  <div class="bar"><span id="crumb">Toolkit</span><span id="time"></span></div>
  <section id="view" aria-live="polite"></section>
</main>
<div id="toast" role="status"></div>
<noscript><p style="padding:24px">This app needs JavaScript.</p></noscript>

<script>
(() => {
  'use strict';

  /* =================== Helpers =================== */
  const $ = (id) => document.getElementById(id);
  const view = $('view');
  const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
  const num = (v, d) => { if (v === null || v === undefined || v === '') return d; const n = Number(v); return Number.isFinite(n) ? n : d; };
  const store = {
    get(k, d = null) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, String(v)); } catch { /* full or blocked */ } },
    json(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v === null ? d : v; } catch { return d; } },
    put(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* full or blocked */ } },
  };
  const hash = (s) => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); };
  const today = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
  const clockText = (d = new Date()) => d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const mmss = (sec) => { sec = Math.max(0, Math.ceil(sec)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); };
  const money = (n) => (n < 0 ? '−$' : '$') + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const signed = (n, digits = 2) => (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n).toFixed(digits);
  const dir = (n) => (n > 0 ? 'up' : n < 0 ? 'down' : 'flat');
  const arrow = (n) => (n > 0 ? '▲' : n < 0 ? '▼' : '•');
  const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  // Tiny element builder: el('button', { class: 'btn', on: fn }, 'text', child, ...)
  function el(tag, props, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v === undefined || v === null || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k === 'on') n.addEventListener('click', v);
      else if (k === 'text') n.textContent = v;
      else if (k === 'focus') n.dataset.autofocus = '1';
      else n.setAttribute(k, v === true ? '' : v);
    }
    if (tag === 'button' && !n.hasAttribute('type')) n.type = 'button';
    for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) n.append(kid);
    return n;
  }

  // append() would print a literal "null" for skipped parts; this skips them.
  const add = (node, ...kids) => node.append(...kids.flat().filter((k) => k !== null && k !== undefined && k !== false));

  let toastTimer = 0;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1400);
  }

  function speak(text) {
    try {
      if (!('speechSynthesis' in window)) return;
      speechSynthesis.cancel();
      speechSynthesis.speak(new SpeechSynthesisUtterance(text));
    } catch { /* speech not available */ }
  }

  let wake = null;
  async function wakeOn() {
    try { if ('wakeLock' in navigator && !wake && document.visibilityState === 'visible') { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch { /* unsupported */ }
  }
  function wakeOff() { try { if (wake) wake.release(); } catch { /* ignore */ } wake = null; }

  /* =================== Data files ===================
     Each tool reads a plain text file next to this page. Edit them on GitHub.
     The last good copy is kept on the glasses for when Wi-Fi drops. */
  async function loadText(file) {
    const key = 'hub.file.' + file;
    try {
      const res = await fetch(file + '?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      if (res.headers.get('X-Offline-Copy')) throw new Error('offline');
      const text = await res.text();
      store.set(key, text);
      store.set(key + '.at', Date.now());
      return { text, offline: false };
    } catch {
      const text = store.get(key);
      if (text !== null) return { text, offline: true, at: num(store.get(key + '.at'), Date.now()) };
      return { text: '', missing: true };
    }
  }
  const offlineNote = (r, file) => r.offline
    ? 'Offline copy of ' + file + ' · saved ' + new Date(r.at).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })
    : r.missing ? 'Couldn’t load ' + file : '';

  /* =================== Screens & Back ===================
     Each screen is a history entry, so the Neural Band's Back gesture
     (middle-finger tap) steps back one screen. Max depth is 3. */
  const screens = {};
  let current = null;
  let leave = null;          // cleanup for the screen being left
  let renderId = 0;

  function go(name, params = {}, replace = false) {
    const st = { s: name, p: params };
    if (replace) history.replaceState(st, ''); else history.pushState(st, '');
    render(st);
  }
  function render(st) {
    if (leave) { try { leave(); } catch { /* ignore */ } leave = null; }
    current = st;
    renderId++;
    view.textContent = '';
    view.scrollTop = 0;
    (screens[st.s] || screens.home)(st.p || {});
  }
  function crumb(text) { $('crumb').textContent = text; }
  function focusFirst() {
    requestAnimationFrame(() => {
      const t = view.querySelector('[data-autofocus]:not(:disabled)') || view.querySelector('button:not(:disabled)');
      if (t) t.focus();
    });
  }
  window.addEventListener('popstate', (e) => render(e.state && e.state.s ? e.state : { s: 'home', p: {} }));

  function tick() { $('time').textContent = clockText(); }
  tick();
  setInterval(tick, 10000);

  /* =================== Home =================== */
  screens.home = () => {
    crumb('Toolkit');
    const h = new Date().getHours();
    const hello = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
    add(view, 
      el('h1', { text: hello }),
      el('p', { class: 'sub', text: new Date().toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' }) }),
      el('div', { class: 'grid2' },
        el('button', { class: 'btn tile', on: () => go('decks'), focus: true }, el('b', { text: 'Practice' }), el('small', { text: 'Quiz yourself' })),
        el('button', { class: 'btn tile', on: () => go('lists') }, el('b', { text: 'Checklists' }), el('small', { text: 'Routines & packing' })),
        el('button', { class: 'btn tile', on: () => go('markets') }, el('b', { text: 'Markets' }), el('small', { text: 'Paper trading' })),
        el('button', { class: 'btn tile', on: () => go('timers') }, el('b', { text: 'Timer' }), el('small', { text: 'Focus & breaks' })),
      ),
      el('div', { class: 'stack', style: 'margin-top: calc(var(--u) * 10)' },
        el('button', { class: 'btn center', on: () => location.assign('../') }, 'Teleprompter'),
      ),
    );
    focusFirst();
  };

  /* =================== Practice ===================
     practice.txt format:
       # Deck title
       Q: question text
       - wrong choice
       * correct choice        (multiple choice: mark the right one with *)
       A: answer               (or a written answer instead of choices)
       Why: explanation        (optional) */
  function parsePractice(raw) {
    const decks = [];
    let deck = null, card = null, mode = null;
    const newDeck = (title) => { deck = { title, id: hash(title), cards: [] }; decks.push(deck); };
    const pushCard = () => {
      if (card) {
        if (!deck) newDeck('Practice');
        if (card.q && (card.a || card.choices.some((c) => c.ok))) { card.id = hash(card.q); deck.cards.push(card); }
      }
      card = null; mode = null;
    };
    for (const line of raw.replace(/\r\n?/g, '\n').split('\n')) {
      const t = line.trim();
      if (!t) continue;
      let m;
      if ((m = t.match(/^#{1,3}\s+(.+)$/))) { pushCard(); newDeck(m[1].trim()); continue; }
      if ((m = t.match(/^(?:Q|Question)\s*\d*\s*[:.)]\s*(.*)$/i))) { pushCard(); card = { q: m[1], a: '', why: '', choices: [] }; mode = 'q'; continue; }
      if (!card) continue;
      if ((m = t.match(/^(?:A|Answer)\s*:\s*(.*)$/i))) { card.a = m[1]; mode = 'a'; continue; }
      if ((m = t.match(/^(?:Why|Explanation|Explain|Because|Note)\s*:\s*(.*)$/i))) { card.why = m[1]; mode = 'why'; continue; }
      if ((m = t.match(/^([*-])\s+(.+)$/)) && (mode === 'q' || mode === 'choice')) { card.choices.push({ text: m[2], ok: m[1] === '*' }); mode = 'choice'; continue; }
      if (mode === 'q') card.q += '\n' + t;
      else if (mode === 'a') card.a += '\n' + t;
      else if (mode === 'why') card.why += ' ' + t;
      else if (mode === 'choice') card.choices[card.choices.length - 1].text += ' ' + t;
    }
    pushCard();
    return decks.filter((d) => d.cards.length);
  }

  let decks = [];
  let session = null;
  const missedKey = (deck) => 'hub.missed.' + deck.id;

  screens.decks = async () => {
    crumb('Practice');
    const id = renderId;
    add(view, el('p', { class: 'sub', text: 'Loading practice.txt…' }));
    const r = await loadText('practice.txt');
    if (id !== renderId) return;
    decks = parsePractice(r.text);
    view.textContent = '';
    if (!decks.length) {
      add(view, 
        el('h1', { text: 'No questions yet' }),
        el('p', { class: 'sub', text: 'Add questions to practice.txt on GitHub, then reload.' }),
        el('button', { class: 'btn primary', on: () => render(current), focus: true }, 'Reload'),
        el('p', { class: 'note', text: offlineNote(r, 'practice.txt') }),
      );
      return focusFirst();
    }
    const shuffleOn = store.get('hub.shuffle', '1') === '1';
    const list = el('div', { class: 'stack' });
    decks.forEach((deck, i) => {
      const ids = new Set(deck.cards.map((c) => c.id));
      const missed = store.json(missedKey(deck), []).filter((x) => ids.has(x));
      const main = el('button', { class: 'btn', on: () => startSession(i, false), focus: i === 0 },
        el('span', { text: deck.title }), el('small', { text: deck.cards.length + ' question' + (deck.cards.length === 1 ? '' : 's') }));
      list.append(missed.length
        ? el('div', { class: 'row', style: 'align-items: stretch' }, main,
            el('button', { class: 'btn center', style: 'flex: 0 0 34%', on: () => startSession(i, true) },
              el('span', { text: 'Review' }), el('small', { text: missed.length + ' missed' })))
        : main);
    });
    add(view, 
      el('h1', { text: 'Pick a deck' }),
      el('p', { class: 'sub', text: 'Pinch an answer, or show it and grade yourself.' }),
      list,
      el('div', { class: 'row', style: 'margin-top: calc(var(--u) * 10)' },
        el('button', {
          class: 'btn center',
          on: (e) => { const on = store.get('hub.shuffle', '1') !== '1'; store.set('hub.shuffle', on ? '1' : '0'); e.currentTarget.querySelector('b').textContent = on ? 'On' : 'Off'; },
        }, 'Shuffle: ', el('b', { text: shuffleOn ? 'On' : 'Off' })),
        el('button', { class: 'btn center', on: () => render(current) }, 'Reload'),
      ),
      el('p', { class: 'note', text: offlineNote(r, 'practice.txt') }),
    );
    focusFirst();
  };

  function startSession(d, missedOnly) {
    const deck = decks[d];
    let cards = deck.cards.slice();
    if (missedOnly) { const m = new Set(store.json(missedKey(deck), [])); cards = cards.filter((c) => m.has(c.id)); }
    if (!cards.length) return toast('Nothing to review');
    if (store.get('hub.shuffle', '1') === '1') shuffle(cards);
    session = { deck, total: cards.length, queue: cards, seen: new Set(), firstRight: 0, missed: new Set(), requeued: new Set(), card: null, n: 0 };
    // From the results screen, reuse its history slot (the glasses allow only 5).
    nextCard(!!current && (current.s === 'done' || current.s === 'card'));
  }

  function nextCard(replace = true) {
    if (!session.queue.length) return finishSession();
    session.card = session.queue.shift();
    if (!session.seen.has(session.card.id)) session.n += 1;
    go('card', {}, replace);
  }

  function grade(right) {
    const c = session.card;
    if (!session.seen.has(c.id)) { session.seen.add(c.id); if (right) session.firstRight += 1; }
    if (!right) {
      session.missed.add(c.id);
      if (!session.requeued.has(c.id)) { session.requeued.add(c.id); session.queue.push(c); }   // ask once more at the end
    }
  }

  /* =================== Checklists ===================
     checklists.txt format:
       # Morning routine (daily)     ← "(daily)" clears the checks every new day
       First item
       Second item */
  function parseLists(raw) {
    const lists = [];
    let cur = null;
    for (const line of raw.replace(/\r\n?/g, '\n').split('\n')) {
      const t = line.trim();
      if (!t) continue;
      const m = t.match(/^#{1,3}\s+(.+)$/);
      if (m) {
        const daily = /\((daily|every ?day)\)\s*$/i.test(m[1]);
        const title = m[1].replace(/\s*\((daily|every ?day)\)\s*$/i, '').trim();
        cur = { title, daily, id: hash(title), items: [] };
        lists.push(cur);
        continue;
      }
      if (!cur) { cur = { title: 'Checklist', daily: false, id: hash('Checklist'), items: [] }; lists.push(cur); }
      const item = t.replace(/^(?:[-*•]\s+|\[[ xX]?\]\s*|\d+[.)]\s+)/, '').trim();
      if (item) cur.items.push(item);
    }
    return lists.filter((l) => l.items.length);
  }

    let st = store.json(k, null);
    if (!st || (list.daily && st.day !== today())) st = { day: today(), done: [] };
    return st;
  }

  /* =================== Markets ===================
     watchlist.txt: one symbol per line. Add a paper position like:
       AAPL @ 225.50 x 10     (bought 10 shares at $225.50)
     Quotes come from Finnhub with your free key, passed in the app link:
       .../hub/?key=YOUR_KEY   (kept on the glasses, never in your public repo) */
  const urlKey = new URLSearchParams(location.search).get('key');
  if (urlKey && /^[A-Za-z0-9_-]{8,80}$/.test(urlKey)) store.set('hub.fhkey', urlKey);
  if (urlKey) history.replaceState(history.state, '', location.pathname);   // hide the key from the address

  function parseWatch(raw) {
    const out = [], seen = new Set();
    for (const line of raw.replace(/\r\n?/g, '\n').split('\n')) {
      const t = line.replace(/\/\/.*$/, '').trim();
      if (!t || t.startsWith('#')) continue;
      const parts = /@|\sat\s|\sx\s|×/i.test(t) ? [t] : t.split(/[\s,]+/);
      for (const p of parts) {
        const m = p.trim().match(/^\$?([A-Za-z][A-Za-z0-9.\-]{0,9})(?:\s*(?:@|at)\s*\$?([\d,]*\.?\d+))?(?:\s*[x×]\s*(-?[\d.]+))?/i);
        if (!m) continue;
        const sym = m[1].toUpperCase();
        if (seen.has(sym)) continue;
        seen.add(sym);
        out.push({ sym, entry: m[2] ? parseFloat(m[2].replace(/,/g, '')) : null, qty: m[3] ? parseFloat(m[3]) : null });
      }
    }
    return out;
  }

  let watch = [];
  let quotes = store.json('hub.quotes', { at: 0, q: {} });
  let quoteErr = '';

  async function fetchQuotes() {
    const key = store.get('hub.fhkey');
    if (!key) { quoteErr = 'nokey'; return; }
    const fresh = {};
    let err = '';
    await Promise.all(watch.map(async (w) => {
      try {
        const res = await fetch('https://finnhub.io/api/v1/quote?symbol=' + encodeURIComponent(w.sym) + '&token=' + encodeURIComponent(key));
        if (res.status === 401 || res.status === 403) { err = 'badkey'; return; }
        if (res.status === 429) { err = 'limit'; return; }
        if (!res.ok) { err = err || 'http'; return; }
        const d = await res.json();
        if (typeof d.c !== 'number' || (d.c === 0 && !d.pc)) { fresh[w.sym] = { bad: true }; return; }
        fresh[w.sym] = d;
      } catch { err = err || 'network'; }
    }));
    if (Object.keys(fresh).length) {
      quotes = { at: Date.now(), q: Object.assign({}, quotes.q, fresh) };
      store.put('hub.quotes', quotes);
    }
    quoteErr = err;
  }

  const posInfo = (w, q) => {
    if (!q || q.bad || w.entry === null) return null;
    const pct = (q.c - w.entry) / w.entry * 100;
    const pl = w.qty !== null ? (q.c - w.entry) * w.qty : null;
    return { pct, pl };
  };

  function statusLine() {
    const age = quotes.at ? ' · as of ' + clockText(new Date(quotes.at)) : '';
    switch (quoteErr) {
      case 'badkey': return 'Finnhub didn’t accept the key' + age;
      case 'limit': return 'Hit the free limit, slowing down' + age;
      case 'network': return 'Can’t reach Finnhub' + (quotes.at ? ', showing last prices' + age : '');
      case 'http': return 'Finnhub had a problem' + age;
      default: return quotes.at ? 'Updated ' + clockText(new Date(quotes.at)) + ' · every ' + refreshSecs() + 's' : 'Loading prices…';
    }
  }
  const refreshSecs = () => (watch.length > 25 ? 60 : 30);

          if (p.pl !== null) { total += p.pl; any = true; }

    };
    add(view, status, summary, el('div', { class: 'stack' }, ...rows), el('p', { class: 'note', text: 'Practice tool for paper trading. ' + (offlineNote(r, 'watchlist.txt') || '') }));
    paint();

  /* =================== Timer =================== */
  const PRESETS = [

  function startTimer(preset) {
    timer = { preset, phase: 'work', round: 1, endAt: Date.now() + preset.work * 60000, left: 0, paused: false, warned: false, finished: false };
    go('run');
  }

  screens.run = () => {
    if (!timer) { history.back(); return; }
    crumb('Timer');
    const phase = el('p', { class: 'phase' });
    const clockEl = el('div', { class: 'clock' });
    const tsub = el('p', { class: 'tsub' });
    const pauseBtn = el('button', { class: 'btn primary', focus: true });
    const remaining = () => (timer.paused ? timer.left : (timer.endAt - Date.now()) / 1000);
    const nudge = (d) => {
      if (timer.finished) return;
      if (timer.paused) timer.left = Math.max(1, timer.left + d * 60);
      else timer.endAt = Math.max(Date.now() + 1000, timer.endAt + d * 60000);
      timer.warned = remaining() <= 60;
      paint();
    };
    const togglePause = () => {
      if (timer.finished) { startTimer(timer.preset); return; }
      if (timer.paused) { timer.endAt = Date.now() + timer.left * 1000; timer.paused = false; }
      else { timer.left = remaining(); timer.paused = true; }
      paint();
    };
    const skip = () => { if (!timer.finished) advance(true); };
    pauseBtn.addEventListener('click', togglePause);

    function advance(skipped) {
      const p = timer.preset;
      if (timer.phase === 'work' && p.rest > 0) {
        timer.phase = 'rest'; timer.endAt = Date.now() + p.rest * 60000;
        if (!skipped) speak('Time for a ' + p.rest + ' minute break.');
      } else if (timer.phase === 'rest') {
        timer.phase = 'work'; timer.round += 1; timer.endAt = Date.now() + p.work * 60000;
        if (!skipped) speak('Break’s over. Back to it.');
      } else {
        timer.finished = true;
        if (!skipped) speak('Time’s up.');
      }
      timer.paused = false;
      timer.warned = false;
      paint();
    }

    function paint() {
      const p = timer.preset;
      const rem = remaining();
      if (!timer.finished && !timer.paused && rem <= 0) { advance(false); return; }
      if (!timer.finished && !timer.paused && !timer.warned && rem <= 60) {
        const len = (timer.phase === 'work' ? p.work : p.rest);
        timer.warned = true;
        if (len >= 3) speak('One minute left.');
      }
      phase.className = 'phase ' + (timer.phase === 'rest' ? 'rest' : 'work');
      phase.textContent = timer.finished ? 'Done' : timer.phase === 'rest' ? 'Break' : (p.rest ? 'Focus' : 'Timer');
      clockEl.textContent = timer.finished ? '0:00' : mmss(rem);
      clockEl.classList.toggle('paused', timer.paused);
      tsub.textContent = timer.finished ? p.name + ' · finished'
        : p.rest ? 'Round ' + timer.round + ' · ' + (timer.phase === 'work' ? 'then a ' + p.rest + ' min break' : 'then ' + p.work + ' min focus')
        : p.name;
      pauseBtn.textContent = timer.finished ? 'Restart' : timer.paused ? 'Resume' : 'Pause';
    }

    add(view, 
      phase, clockEl, tsub,
      el('div', { class: 'row' },
        el('button', { class: 'btn center', on: () => nudge(-1) }, '−1 min'),
        pauseBtn,
        el('button', { class: 'btn center', on: () => nudge(1) }, '+1 min')),
      el('div', { class: 'row', style: 'margin-top: calc(var(--u) * 10)' },
        el('button', { class: 'btn center', on: skip }, timer.preset.rest ? 'Skip to next' : 'Finish now'),
        el('button', { class: 'btn center', on: () => history.back() }, 'End')),
    );
    paint();
    wakeOn();
    const t = setInterval(paint, 250);
    leave = () => { clearInterval(t); wakeOff(); timer = null; };
    focusFirst();
  };

  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && current && current.s === 'run') wakeOn(); });

  /* =================== Start =================== */
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* optional */ });
  }
  history.replaceState({ s: 'home', p: {} }, '');
  render({ s: 'home', p: {} });
})();
</script>
</body>
</html>
